[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clouddog"
version = "0.1.0"
description = "Autonomous disk hygiene engine: mirror everything to GitHub/TeraBox/Drive, verify byte-exact, then clear local."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
clouddog = "clouddog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
