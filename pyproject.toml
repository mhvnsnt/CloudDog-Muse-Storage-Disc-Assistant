[project]
name = "clouddog"
version = "0.1.0"
description = "CloudDog policy engine, Drive store, config, and registry bridge (extends the cloud_dog.py engine)"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["clouddog*"]

[tool.ruff]
line-length = 100
