[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clouddog"
version = "0.1.0"
description = "Autonomous disk hygiene engine: mirror everything to GitHub/TeraBox/Drive, verify byte-exact, then clear local. Includes the clouddog policy-engine package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml"]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["clouddog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
