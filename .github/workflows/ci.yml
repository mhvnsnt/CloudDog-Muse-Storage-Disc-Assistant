name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest (v3 engine + root script tests)
        # The v1 engine suite (tests/v1/) needs src/ on the path and would
        # shadow the installed clouddog package; it runs in the next step.
        run: python -m pytest -q --ignore=tests/v1
      - name: Pytest (v1 engine suite, src/clouddog)
        # tests/v1/conftest.py re-points the `clouddog` import at src/
        # (the repo root also has a clouddog/ package from the v3 lane).
        # Uninstall the editable v3 package first: its meta-path finder
        # would otherwise shadow src/ regardless of sys.path order.
        run: |
          pip uninstall -y clouddog
          python -m pytest tests/v1 -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Lint scope is the clouddog/ engine package and its tests only.
      # Root-level scripts (cloud_dog.py, spark-app helpers) belong to
      # sibling lanes and are covered by their own test files.
      - run: ruff check clouddog tests
      - run: ruff format --check clouddog tests
