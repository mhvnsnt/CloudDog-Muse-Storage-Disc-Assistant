name: ci

# CI minute diet (research-friction-20261019/03-ci-flakes.md, Plan B):
# - PR-only triggers: a push to a PR branch used to run the full suite TWICE
#   (push-to-branch + pull_request synchronize). Branch pushes no longer run
#   CI; the PR covers them, and main-push runs once.
# - Concurrency cancel kills superseded PR runs instead of billing them.
# - Path filters skip the suite for docs-only changes.
# - PRs run the main leg (3.12) only; the full matrix (3.11 + 3.12) runs on
#   the nightly schedule.
# - pip caching on setup-python; the lint job is merged into the test job
#   (every job rounds up to a whole billed minute, tiny jobs included).

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Nightly runs the full matrix; PRs and main pushes run the main leg.
        python-version: ${{ github.event_name == 'schedule' && fromJSON('["3.11", "3.12"]') || fromJSON('["3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest (v3 engine + root script tests)
        # The v1 engine suite (tests/v1/) needs src/ on the path and would
        # shadow the installed clouddog package; it runs in the next step.
        run: python -m pytest -q --ignore=tests/v1
      - name: Pytest (v1 engine suite, src/clouddog)
        # tests/v1/conftest.py re-points the `clouddog` import at src/
        # (the repo root also has a clouddog/ package from the v3 lane).
        # Uninstall the editable v3 package first: its meta-path finder
        # would otherwise shadow src/ regardless of sys.path order.
        run: |
          pip uninstall -y clouddog
          python -m pytest tests/v1 -q
      # Lint scope is the clouddog/ engine package and its tests only.
      # Root-level scripts (cloud_dog.py, spark-app helpers) belong to
      # sibling lanes and are covered by their own test files.
      # Ruff is already installed via the dev extra (.[dev] above).
      - name: Lint (ruff, main leg only)
        if: matrix.python-version == '3.12'
        run: |
          python -m ruff check clouddog tests
          python -m ruff format --check clouddog tests
